services:
  mysql:
    image: mysql:8.0
    container_name: local_mysql_db
    ports:
      - "33061:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: e_paper
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    command: ["--sort_buffer_size=8M"]
    volumes:
      - e_paper_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mysql_network

volumes:
  e_paper_data:

networks:
  mysql_network:
